.pos{color:#34d399}.neg{color:#f87171}.wrn{color:#fbbf24}.pjc{color:#60a5fa}

.p-bd{background:rgba(248,113,113,.14);color:#f87171;border-color:rgba(248,113,113,.24)}
.track{height:11px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden;border:1px solid rgba(255,255,255,.05)}

table{width:100%;border-collapse:collapse;font-size:13.5px}

td{padding:10px 8px;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
tr:hover td{background:rgba(255,255,255,.025)}
.scroll{overflow-x:auto}
.btn{

  border-radius:12px;padding:0 14px;font-weight:600;font-size:13.5px;cursor:pointer;

}
.btn:hover{border-color:rgba(255,255,255,.26);background:#1f2c25}

.btn-ac:hover{filter:brightness(1.06)}
