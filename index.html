<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b100e">
<link rel="manifest" href="manifest.json">
<title>Planejamento Financeiro · Super App</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.5"></script>
<script>
if(window.tailwind)tailwind.config={theme:{extend:{colors:{bg:'#0b100e',sf:'#121a16',sf2:'#18221d',ln:'rgba(255,255,255,.09)',ink:'#eef5f1',dim:'#95a79e',ac:'#34d399',wr:'#fbbf24',bd:'#f87171',pj:'#60a5fa'},fontFamily:{head:['"Plus Jakarta Sans"','Inter','sans-serif'],body:['Inter','system-ui','sans-serif']}}}};
</script>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{
  margin:0;
  background:
    radial-gradient(900px 420px at 12% -8%, rgba(52,211,153,.11), transparent 60%),
    radial-gradient(760px 380px at 90% -6%, rgba(96,165,250,.10), transparent 60%),
    #0b100e;
  color:#eef5f1;
  font:15px/1.5 Inter,system-ui,sans-serif;
  overflow-x:clip;
  font-variant-numeric:tabular-nums;
  padding-left:env(safe-area-inset-left,0);
  padding-right:env(safe-area-inset-right,0);
  padding-bottom:calc(28px + env(safe-area-inset-bottom,0));
}
h1,h2,h3{font-family:"Plus Jakarta Sans",Inter,sans-serif;text-wrap:balance;margin:0;letter-spacing:-0.015em}
.card{
  background:linear-gradient(180deg, rgba(24,34,29,.72) 0%, rgba(18,26,22,.92) 100%);
  border:1px solid rgba(255,255,255,.085);
  border-radius:20px;
  padding:20px;
  box-shadow:0 14px 34px rgba(0,0,0,.28);
}
.card h2{font-size:15.5px;font-weight:700;margin-bottom:14px;color:#eef5f1;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.card h2 small{font:500 12px Inter,sans-serif;color:#95a79e}
.lbl{font-size:12.5px;color:#95a79e}
.big{font:800 clamp(18px,2.1vw,24px)/1.12 "Plus Jakarta Sans",Inter,sans-serif;white-space:nowrap}
.nw{white-space:nowrap}
.pos{color:#34d399}.neg{color:#f87171}.wrn{color:#fbbf24}.pjc{color:#60a5fa}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:rgba(52,211,153,.13);color:#34d399}.p-wr{background:rgba(251,191,36,.13);color:#fbbf24}.p-bd{background:rgba(248,113,113,.14);color:#f87171}
.track{height:11px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden}
.track>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#10b981,#34d399);transition:width .4s ease}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-weight:600;color:#95a79e;text-align:left;padding:10px 8px;border-bottom:1px solid rgba(255,255,255,.1);font-size:12px;text-transform:uppercase;white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;
  border-radius:12px;padding:0 13px;font-weight:600;font-size:13px;cursor:pointer;
  border:1px solid rgba(255,255,255,.12);background:#18221d;color:#eef5f1;white-space:nowrap
}
.btn:hover{border-color:rgba(255,255,255,.25)}
.btn-sm{min-height:32px;padding:0 10px;font-size:12px;border-radius:9px}
.btn-ac{background:linear-gradient(135deg,#34d399,#10b981);color:#052017;border-color:transparent}
.btn-ed{background:rgba(96,165,250,.14);color:#93c5fd;border-color:rgba(96,165,250,.32)}
.btn-del{background:rgba(248,113,113,.14);color:#fca5a5;border-color:rgba(248,113,113,.32)}
.btn-voice-on{background:rgba(248,113,113,.18);color:#fca5a5;border-color:rgba(248,113,113,.48)}
input,select{
  font:15px Inter,sans-serif;background:#18221d;color:#eef5f1;
  border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:9px 12px;width:100%
}
#tabs{
  display:flex;
  flex-wrap:nowrap;
  align-items:center;
  gap:6px;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
#tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  white-space:nowrap;
  line-height:1.2;
  min-height:38px;
  border-radius:12px;
  padding:8px 13px;
  font-weight:600;
  font-size:13px;
  color:#95a79e;
  cursor:pointer;
  background:none;
  border:1px solid transparent;
}
.tab.on{background:#18221d;color:#eef5f1;border-color:rgba(52,211,153,.28)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.11);background:#18221d;color:#95a79e;font-weight:600;font-size:13px;cursor:pointer;padding:0 10px}
.seg button.on{background:rgba(52,211,153,.18);color:#34d399;border-color:rgba(52,211,153,.45)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.fig{position:relative;height:260px}
dialog{border:1px solid rgba(255,255,255,.12);padding:0;background:#121a16;color:#eef5f1;border-radius:22px;width:min(640px,96vw);max-height:92dvh}
dialog::backdrop{background:rgba(4,7,6,.75)}
.toast{
  position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0));
  transform:translate(-50%,20px);opacity:0;transition:all .25s ease;
  background:#eef5f1;color:#0b100e;border-radius:14px;padding:11px 16px;
  font-weight:600;font-size:14px;z-index:80;max-width:92vw;pointer-events:none
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:#ef4444;color:#fff}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:13.5px}
.kv:last-child{border-bottom:0}.kv span:first-child{color:#95a79e}.kv span:last-child{font-weight:600;text-align:right}
.empty{color:#95a79e;font-size:13.5px;padding:18px 0;text-align:center}
[hidden]{display:none!important}

@media (max-width:640px){
  body{font-size:14px}
  .card{padding:15px;border-radius:16px}
  .card h2{font-size:14.5px;margin-bottom:11px}
  .btn{min-height:36px;padding:0 11px;font-size:12.5px}
  .btn-sm{min-height:30px;padding:0 8px;font-size:11.5px}
  input,select{font-size:14px;padding:8px 10px}
  table{font-size:12.5px}
  th,td{padding:8px 6px}
  .kv{flex-direction:column;gap:2px;padding:8px 0}
  .kv span:last-child{text-align:left}
  .fig{height:210px}
}
</style>
</head>
<body>

<header class="sticky top-0 z-40 border-b border-ln" style="background:rgba(11,16,14,.92);backdrop-filter:blur(12px);padding-top:env(safe-area-inset-top,0)">
  <div class="max-w-[1240px] mx-auto px-3 sm:px-4 pt-2.5 pb-2 flex flex-wrap items-center gap-x-2.5 gap-y-2">
    <div class="flex items-center gap-2.5 mr-auto">
      <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-2xl grid place-items-center font-head font-extrabold text-[14px] sm:text-[15px]" style="background:linear-gradient(135deg,#34d399,#10b981);color:#052017">L+R</div>
      <div>
        <h1 class="text-[16px] sm:text-[17px] font-extrabold leading-tight">Planejamento Financeiro</h1>
        <div class="flex flex-wrap items-center gap-1.5 text-[11.5px] sm:text-[12px] text-dim">
          <span id="connDot" class="dot" style="background:#95a79e"></span>
          <span id="connTxt">Modo local</span>
          <span id="syncAt"></span>
        </div>
      </div>
    </div>
    <label class="flex items-center gap-1.5 text-[12.5px] sm:text-[13px] text-dim">Mês
      <select id="monthSel" style="width:auto;min-width:96px;min-height:36px" aria-label="Mês"></select>
    </label>
    <button class="btn" id="btnSync" type="button">↻ Sincronizar</button>
    <button class="btn" id="btnCfg" type="button">⚙ URL /exec</button>
  </div>
  <div class="max-w-[1240px] mx-auto px-3 sm:px-4 pb-2">
    <form id="quickForm" class="flex gap-2" autocomplete="off">
      <input id="quickIn" placeholder="Ex.: Assaí 250 xp · Farmácia 85 nubank · IPVA 600" aria-label="Lançamento rápido">
      <button class="btn" id="btnVoice" type="button" aria-label="Lançamento por voz">🎤</button>
      <button class="btn btn-ac nw" type="submit">+ Lançar</button>
    </form>
  </div>
  <nav class="max-w-[1240px] mx-auto px-3 sm:px-4 pb-2" id="tabs" role="tablist">
    <button class="tab on" data-tab="painel" role="tab">📊 Painel</button>
    <button class="tab" data-tab="diario" role="tab">📒 Diário & Lançamentos</button>
    <button class="tab" data-tab="dividas" role="tab">💳 Cartões & Dívidas</button>
    <button class="tab" data-tab="acerto" role="tab">👫 Acerto com Renato</button>
    <button class="tab" data-tab="projecao" role="tab">📈 Projeção & Orçamento</button>
  </nav>
</header>
<main class="max-w-[1240px] mx-auto px-3 sm:px-4 py-4 sm:py-5 space-y-4">
  <div id="queueBar"></div>

  <section data-panel="painel" class="grid grid-cols-12 gap-3 sm:gap-4">
    <div class="card col-span-12" id="kpiCard"></div>
    <div class="card col-span-12 lg:col-span-7" id="phaseCard"></div>
    <div class="card col-span-12 lg:col-span-5" id="envCard"></div>
    <div class="card col-span-12" id="recentCard"></div>
  </section>

  <section data-panel="diario" class="grid grid-cols-12 gap-3 sm:gap-4" hidden>
    <div class="card col-span-12" id="cardsResume"></div>
    <div class="card col-span-12">
      <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
        <h2 class="m-0">Extrato do Diário <small id="exCount"></small></h2>
        <button type="button" class="btn btn-ac" id="btnNewDetailed">+ Lançamento detalhado</button>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-4 gap-2.5 mb-3">
        <input id="fBusca" placeholder="Buscar descrição ou categoria" class="sm:col-span-2">
        <select id="fTipo"><option value="">Todos os tipos</option><option>Gasto</option><option>Entrada</option></select>
        <select id="fCartaoFilter"><option value="">Todos os cartões</option><option value="sem">Sem cartão</option></select>
      </div>
      <div class="scroll" style="max-height:560px;overflow-y:auto"><table id="exTable"></table></div>
    </div>
  </section>

  <section data-panel="dividas" class="grid grid-cols-12 gap-3 sm:gap-4" hidden>
    <div class="card col-span-12 lg:col-span-6" id="cartoesAtivosCard"></div>
    <div class="card col-span-12 lg:col-span-6" id="simCard"></div>
    <div class="card col-span-12" id="addCardFormCard"></div>
    <div class="card col-span-12" id="dividaFormCard"></div>
    <div class="card col-span-12" id="dividaListaCard"></div>
  </section>

  <section data-panel="acerto" class="grid grid-cols-12 gap-3 sm:gap-4" hidden>
    <div class="card col-span-12 lg:col-span-6" id="acCard"></div>
    <div class="card col-span-12 lg:col-span-6" id="impCard"></div>
  </section>

  <section data-panel="projecao" class="grid grid-cols-12 gap-3 sm:gap-4" hidden>
    <div class="card col-span-12" id="orcCard"></div>
    <div class="card col-span-12 lg:col-span-6"><h2>Entradas × Gastos</h2><div class="fig"><canvas id="chFlux"></canvas></div></div>
    <div class="card col-span-12 lg:col-span-6"><h2>Reserva de emergência</h2><div class="fig"><canvas id="chRes"></canvas></div></div>
    <div class="card col-span-12" id="projTableCard"></div>
  </section>
</main>

<dialog id="dlg" aria-labelledby="dlgT">
  <form id="lForm" class="p-4 sm:p-5 space-y-3" autocomplete="off">
    <input type="hidden" id="editTxId" value="">
    <div class="flex items-start gap-3">
      <h3 id="dlgT" class="text-[18px] sm:text-[19px] font-bold mr-auto">Novo lançamento</h3>
      <button type="button" class="btn" id="dlgX" style="min-height:36px;padding:0 11px">✕</button>
    </div>
    <div>
      <div class="lbl mb-1">Tipo</div>
      <div class="seg" id="sTipo">
        <button type="button" data-v="Gasto" class="on">Gasto</button>
        <button type="button" data-v="Entrada">Entrada</button>
      </div>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div><label class="lbl block mb-1" for="lData">Data</label><input type="date" id="lData" required></div>
      <div><label class="lbl block mb-1" for="lValor">Valor total (R$)</label><input id="lValor" inputmode="decimal" placeholder="0,00" required></div>
    </div>
    <div><label class="lbl block mb-1" for="lDesc">Descrição</label><input id="lDesc" required></div>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div>
        <label class="lbl block mb-1" for="lForma">Forma</label>
        <select id="lForma"><option>Crédito</option><option>Pix</option><option>Débito</option><option>Boleto</option></select>
      </div>
      <div>
        <label class="lbl block mb-1" for="lCartao">Cartão</label>
        <select id="lCartao"></select>
      </div>
    </div>
    <div>
      <label class="lbl block mb-1" for="lCat">Categoria</label>
      <select id="lCat">
        <option>Alimentação – mercado</option>
        <option>Alimentação – fora/delivery</option>
        <option>Lazer e compras</option>
        <option>Moradia</option>
        <option>Transporte – combustível</option>
        <option>Saúde e seguros</option>
        <option>Assinaturas e fixos</option>
        <option>Impostos (IPVA / IPTU)</option>
        <option>Outros</option>
      </select>
    </div>
    <div>
      <div class="lbl mb-1">Divisão (Acerto com Renato)</div>
      <div class="seg" id="sDiv">
        <button type="button" data-v="0.4" class="on">XP conjunto · Luana (40%) / Renato (60%)</button>
        <button type="button" data-v="0">Sem divisão (0%)</button>
        <button type="button" data-v="0.5">50% / 50%</button>
        <button type="button" data-v="1">100% Luana</button>
      </div>
    </div>
    <div class="rounded-2xl p-3.5 text-[13px]" style="background:#18221d" id="splitPreview"></div>
    <button type="submit" class="btn btn-ac w-full" id="lSubmitBtn">Salvar lançamento</button>
  </form>
</dialog>

<dialog id="cfgDlg" aria-labelledby="cfgT">
  <form id="cfgForm" class="p-4 sm:p-5 space-y-3">
    <div class="flex items-start gap-3">
      <h3 id="cfgT" class="text-[18px] font-bold mr-auto">Conexão Google Apps Script (/exec)</h3>
      <button type="button" class="btn" id="cfgX" style="min-height:36px;padding:0 11px">✕</button>
    </div>
    <p class="lbl">Cole aqui a URL publicada do Web App (<span class="nw">/exec</span>) apenas neste dispositivo.</p>
    <input id="cfgUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec">
    <div class="flex gap-2 pt-1">
      <button type="submit" class="btn btn-ac flex-1">Salvar e Sincronizar</button>
      <button type="button" class="btn" id="cfgClear">Limpar</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" onload="window.__chartLoaded&&window.__chartLoaded()"></script>
<script>
(function(){
"use strict";

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}

var STORAGE={
  DATA:"cerebro_renato_luana_data_v2",
  QUEUE:"cerebro_renato_luana_queue_v2",
  URL:"cerebro_renato_luana_exec_url_v2",
  SYNC_AT:"cerebro_renato_luana_sync_at_v2"
};
var MON=["jan.","fev.","mar.","abr.","mai.","jun.","jul.","ago.","set.","out.","nov.","dez."];
var MONTHS=[];
for(var i=0;i<14;i++){
  var m=(10+i)%12, y=2026+Math.floor((10+i)/12);
  MONTHS.push({key:MON[m]+"/"+String(y).slice(2),m:m,y:y});
}

var ENV_BY_CAT={
  "Alimentação – mercado":"🏠 Essenciais",
  "Alimentação – fora/delivery":"🎉 Lazer",
  "Lazer e compras":"🎉 Lazer",
  "Moradia":"📌 Fixo/outro",
  "Transporte – combustível":"🏠 Essenciais",
  "Saúde e seguros":"🏠 Essenciais",
  "Assinaturas e fixos":"📌 Fixo/outro",
  "Impostos (IPVA / IPTU)":"📌 Fixo/outro",
  "Outros":"🎉 Lazer"
};

var DEFAULT_CARDS=[
  {nome:"XP conjunto",pctPadrao:0.4},
  {nome:"Nubank",pctPadrao:0}
];

var $=function(id){return document.getElementById(id);};
var brl=function(v){return Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];});};

function toast(msg,err){
  var t=$("toast");
  if(!t)return;
  t.textContent=msg;
  t.className="toast show"+(err?" err":"");
  clearTimeout(toast._tm);
  toast._tm=setTimeout(function(){t.className="toast";},3000);
}

function getExecUrl(){return (localStorage.getItem(STORAGE.URL)||"").trim();}
function getQueue(){try{return JSON.parse(localStorage.getItem(STORAGE.QUEUE)||"[]");}catch(e){return [];}}
function saveQueue(q){localStorage.setItem(STORAGE.QUEUE,JSON.stringify(q));renderQueueBar();}

function ensureTxId(item){
  if(!item.clientTxId){
    item.clientTxId="tx_"+Date.now()+"_"+Math.random().toString(36).slice(2,7);
  }
  return item.clientTxId;
}

function loadState(){
  try{
    var s=JSON.parse(localStorage.getItem(STORAGE.DATA)||"null");
    if(s&&Array.isArray(s.lancamentos)){
      if(!Array.isArray(s.dividas))s.dividas=[];
      if(!Array.isArray(s.cartoes)||!s.cartoes.length)s.cartoes=DEFAULT_CARDS.slice();
      s.lancamentos.forEach(function(l){ensureTxId(l);});
      return s;
    }
  }catch(e){}
  return {
    mesAtual:"nov./26",
    saldoConta:0,
    metaReserva:18870.48,
    reservaAtual:0,
    envelopeEssenciaisMeta:2300,
    envelopeLazerMeta:750,
    cartoes:DEFAULT_CARDS.slice(),
    lancamentos:[],
    dividas:[]
  };
}
function saveState(st){try{localStorage.setItem(STORAGE.DATA,JSON.stringify(st));}catch(e){}}

var state=loadState();
var charts={};

function getCardConfig(nome){
  var list=state.cartoes||DEFAULT_CARDS;
  for(var i=0;i<list.length;i++){
    if(list[i].nome===nome)return list[i];
  }
  return {nome:nome,pctPadrao:nome==="XP conjunto"?0.4:0};
}

function defaultPctForCard(cartao){
  if(!cartao)return 0;
  return Number(getCardConfig(cartao).pctPadrao||0);
}

function refreshCardSelects(){
  var cards=state.cartoes||DEFAULT_CARDS;
  var curL=$("lCartao")?$("lCartao").value:"";
  if($("lCartao")){
    $("lCartao").innerHTML=cards.map(function(c){
      var p=Math.round(Number(c.pctPadrao||0)*100);
      var lbl=c.nome+(p>0?(" ("+p+"% Luana / "+(100-p)+"% Renato)"):(" (0% divisão)"));
      return '<option value="'+esc(c.nome)+'">'+esc(lbl)+'</option>';
    }).join("")+'<option value="">Sem cartão</option>';
    if(curL)Array.from($("lCartao").options).forEach(function(o){if(o.value===curL)$("lCartao").value=curL;});
  }

  var curF=$("fCartaoFilter")?$("fCartaoFilter").value:"";
  if($("fCartaoFilter")){
    $("fCartaoFilter").innerHTML='<option value="">Todos os cartões</option>'+
      cards.map(function(c){return '<option value="'+esc(c.nome)+'">'+esc(c.nome)+'</option>';}).join("")+
      '<option value="sem">Sem cartão</option>';
    if(curF)$("fCartaoFilter").value=curF;
  }

  var curD=$("dCartao")?$("dCartao").value:"";
  if($("dCartao")){
    $("dCartao").innerHTML='<option value="">Sem cartão</option>'+
      cards.map(function(c){return '<option value="'+esc(c.nome)+'">'+esc(c.nome)+'</option>';}).join("");
    if(curD)$("dCartao").value=curD;
  }
}

function addCardToApp(nome,pctPadrao){
  var lim=String(nome||"").trim();
  if(!lim)return toast("Informe o nome do cartão.",true);
  state.cartoes=state.cartoes||DEFAULT_CARDS.slice();
  var exists=state.cartoes.some(function(c){return c.nome.toLowerCase()===lim.toLowerCase();});
  if(exists)return toast("Esse cartão já está cadastrado.",true);
  state.cartoes.push({nome:lim,pctPadrao:Number(pctPadrao||0)});
  saveState(state);
  refreshCardSelects();
  renderAll();
  toast("Cartão \""+lim+"\" adicionado!");
}

function updateConn(){
  var qLen=getQueue().length;
  var hasUrl=!!getExecUrl();
  var at=localStorage.getItem(STORAGE.SYNC_AT);
  if($("syncAt"))$("syncAt").textContent=at?"· "+at:"";
  if(!$("connDot")||!$("connTxt"))return;
  if(!navigator.onLine){
    $("connDot").style.background="#f87171";
    $("connTxt").textContent=qLen>0?("Offline ("+qLen+" na fila)"):"Offline";
    return;
  }
  if(!hasUrl){
    $("connDot").style.background="#fbbf24";
    $("connTxt").textContent=qLen>0?("Sem /exec ("+qLen+" na fila)"):"Modo local";
    return;
  }
  $("connDot").style.background=qLen>0?"#fbbf24":"#34d399";
  $("connTxt").textContent=qLen>0?("Online ("+qLen+" pendente)"):("Sincronizado (/exec)");
}

function renderQueueBar(){
  var q=getQueue();
  var bar=$("queueBar");
  if(!bar)return;
  if(!q.length){bar.innerHTML="";updateConn();return;}
  bar.innerHTML='<div class="card flex flex-wrap items-center justify-between gap-3" style="border-color:rgba(251,191,36,.38)">'+
    '<div><strong class="wrn">⏳ '+q.length+' ação(ões) aguardando internet</strong><div class="lbl">Enviadas automaticamente quando a conexão voltar.</div></div>'+
    '<button type="button" class="btn btn-ac" id="btnFlushNow">Sincronizar fila</button></div>';
  if($("btnFlushNow"))$("btnFlushNow").onclick=function(){syncAll(false);};
  updateConn();
}

function parseQuick(text){
  var raw=String(text||"").trim();
  var tipo=/\b(entrada|recebi|recebido|receita|repasse|reembolso)\b/i.test(raw)?"Entrada":"Gasto";
  var mVal=raw.match(/(?:r\$\s*)?(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:,\d{1,2})?|\d+\.\d{1,2})/i);
  var valor=0;
  if(mVal){
    var v=mVal[1];
    valor=/,/.test(v)?parseFloat(v.replace(/\./g,"").replace(",",".")):parseFloat(v);
  }

  var cartao="";
  var forma="Pix";
  var cards=state.cartoes||DEFAULT_CARDS;
  for(var i=0;i<cards.length;i++){
    var cn=cards[i].nome;
    var re=new RegExp("\\b"+cn.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i");
    if(re.test(raw)){
      cartao=cn;
      forma="Crédito";
      break;
    }
  }
  if(!cartao&&/\b(xp|conjunto)\b/i.test(raw)){
    cartao="XP conjunto";
    forma="Crédito";
  }else if(!cartao&&/\b(nubank|nu)\b/i.test(raw)){
    cartao="Nubank";
    forma="Crédito";
  }else if(!cartao&&/\b(cr[ée]dito|cart[ãa]o)\b/i.test(raw)){
    forma="Crédito";
    cartao=cards.length?cards[0].nome:"XP conjunto";
  }else if(/\b(d[ée]bito)\b/i.test(raw)){
    forma="Débito";
  }else if(/\b(boleto)\b/i.test(raw)){
    forma="Boleto";
  }

  var pctLuana=defaultPctForCard(cartao);
  if(tipo==="Entrada"||(forma!=="Crédito"&&!/\b(xp|conjunto|dividido|luana|renato)\b/i.test(raw)))pctLuana=0;
  if(/\b(50%|metade)\b/i.test(raw))pctLuana=0.5;
  if(/\b(100%)\b/i.test(raw))pctLuana=1;
  if(/\b(sem divis[aã]o|0%)\b/i.test(raw))pctLuana=0;

  var cat="Outros";
  if(/\b(ipva|iptu|imposto|licenciamento)\b/i.test(raw))cat="Impostos (IPVA / IPTU)";
  else if(/\b(assai|mercado|atacad|feira|supermerc)\b/i.test(raw))cat="Alimentação – mercado";
  else if(/\b(ifood|delivery|lanche|restaur|bebida|pizza|cerveja)\b/i.test(raw))cat="Alimentação – fora/delivery";
  else if(/\b(combust|gasolina|posto|uber|99|prf)\b/i.test(raw))cat="Transporte – combustível";
  else if(/\b(farmac|unimed|cassems|remedio|remédio|saude|saúde)\b/i.test(raw))cat="Saúde e seguros";
  else if(/\b(assinatura|claude|internet|vivo|netflix|spotify)\b/i.test(raw))cat="Assinaturas e fixos";
  else if(/\b(shopee|amazon|mercado livre|aliexpress|magalu|compra|loja)\b/i.test(raw))cat="Lazer e compras";

  var desc=raw
    .replace(/(?:r\$\s*)?(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:,\d{1,2})?|\d+\.\d{1,2})/gi," ")
    .replace(/\b(xp|conjunto|nubank|nu|cr[ée]dito|cart[ãa]o|pix|d[ée]bito|boleto|dividido|luana|renato|50%|100%|0%)\b/gi," ")
    .replace(/\s+/g," ").trim();
  if(!desc)desc=raw;
  desc=desc.charAt(0).toUpperCase()+desc.slice(1);

  var hoje=new Date();
  var dataStr=String(hoje.getDate()).padStart(2,"0")+"/"+String(hoje.getMonth()+1).padStart(2,"0")+"/"+hoje.getFullYear();

  return {
    data:dataStr,
    desc:desc,
    valor:isNaN(valor)?0:valor,
    tipo:tipo,
    forma:forma,
    cartao:cartao,
    cat:cat,
    pctLuana:pctLuana
  };
}

function buildApiPayload(acao,entry){
  var txId=ensureTxId(entry);
  var pct=Number(entry.pctLuana||0);
  var divididoStr=pct>0?(Math.round(pct*100)+"%"):"Não";
  return {
    origem:"APP_GITHUB",
    acao:acao,
    action:acao,
    clientTxId:txId,
    lancamento:{
      clientTxId:txId,
      data:entry.data,
      descricao:entry.desc,
      desc:entry.desc,
      valor:Number(entry.valor||0),
      tipo:entry.tipo,
      forma:entry.forma,
      cartao:entry.cartao||"",
      categoria:entry.cat||"Outros",
      cat:entry.cat||"Outros",
      dividido:divididoStr,
      pctLuana:pct
    }
  };
}

async function postPayload(payload){
  var url=getExecUrl();
  if(!url||!navigator.onLine)throw new Error("offline");
  var res=await fetch(url,{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(payload)
  });
  if(!res.ok)throw new Error("http");
}

async function flushQueue(){
  var q=getQueue();
  if(!q.length||!getExecUrl()||!navigator.onLine)return;
  var rest=[];
  for(var i=0;i<q.length;i++){
    try{await postPayload(q[i]);}
    catch(e){rest.push(q[i]);}
  }
  saveQueue(rest);
}

async function syncAll(silent){
  updateConn();
  renderQueueBar();
  var url=getExecUrl();
  if(!navigator.onLine){
    if(!silent)toast("Sem internet: alterações ficam na fila local.",true);
    return;
  }
  await flushQueue();
  if(url){
    try{
      var res=await fetch(url+"?action=getAll");
      if(res.ok){
        var remote=await res.json();
        if(remote&&typeof remote==="object"&&Array.isArray(remote.lancamentos)){
          state=Object.assign({},state,remote);
          if(!Array.isArray(state.lancamentos))state.lancamentos=[];
          if(!Array.isArray(state.dividas))state.dividas=[];
          if(!Array.isArray(state.cartoes)||!state.cartoes.length)state.cartoes=DEFAULT_CARDS.slice();
          state.lancamentos.forEach(function(l){ensureTxId(l);});
          saveState(state);
        }
        localStorage.setItem(STORAGE.SYNC_AT,new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}));
        if(!silent)toast("Sincronizado com a planilha!");
      }
    }catch(e){
      if(!silent)toast("Não foi possível ler o /exec; usando cache local.",true);
    }
  }
  updateConn();
  refreshCardSelects();
  renderAll();
}

async function saveLancamento(entry){
  ensureTxId(entry);
  state.lancamentos.unshift(entry);
  saveState(state);
  renderAll();
  var payload=buildApiPayload("gravar",entry);
  try{
    await postPayload(payload);
    localStorage.setItem(STORAGE.SYNC_AT,new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}));
    updateConn();
    toast("Salvo e sincronizado!");
  }catch(e){
    var q=getQueue();
    q.push(payload);
    saveQueue(q);
    toast("Sem internet: salvo na fila para sincronizar depois.");
  }
}

async function updateLancamento(updatedEntry){
  var txId=ensureTxId(updatedEntry);
  var idx=(state.lancamentos||[]).findIndex(function(l){return l.clientTxId===txId;});
  if(idx>=0){
    state.lancamentos[idx]=Object.assign({},state.lancamentos[idx],updatedEntry,{clientTxId:txId});
  }else{
    state.lancamentos.unshift(updatedEntry);
  }
  saveState(state);
  renderAll();

  var payload=buildApiPayload("editar",updatedEntry);
  try{
    await postPayload(payload);
    localStorage.setItem(STORAGE.SYNC_AT,new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}));
    updateConn();
    toast("Lançamento editado e sincronizado!");
  }catch(e){
    var q=getQueue();
    q.push(payload);
    saveQueue(q);
    toast("Sem internet: edição na fila para sincronizar depois.");
  }
}

async function cancelarLancamento(txId){
  if(!txId)return;
  var alvo=(state.lancamentos||[]).find(function(l){return l.clientTxId===txId;});
  if(!alvo)return;
  if(!confirm("Deseja cancelar e excluir este lançamento: \""+(alvo.desc||"Lançamento")+"\" ("+brl(alvo.valor)+")?"))return;

  state.lancamentos=(state.lancamentos||[]).filter(function(l){return l.clientTxId!==txId;});
  saveState(state);
  renderAll();

  var payload=buildApiPayload("excluir",alvo);
  try{
    await postPayload(payload);
    localStorage.setItem(STORAGE.SYNC_AT,new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}));
    updateConn();
    toast("Lançamento cancelado e removido da planilha!");
  }catch(e){
    var q=getQueue();
    q.push(payload);
    saveQueue(q);
    toast("Sem internet: cancelamento na fila para sincronizar.");
  }
}

async function saveDivida(div){

function abaterDivida(id,valorAbate){
  var list=state.dividas||[];
  for(var i=0;i<list.length;i++){
    if(list[i].id===id){
      var atual=Number(list[i].saldo||0);
      var novo=Math.max(0,atual-Number(valorAbate||0));
      list[i].saldo=novo;
      if(novo===0)list[i].pago=true;
      break;
    }
  }
  saveState(state);
  renderAll();
  toast("Saldo da dívida atualizado.");
}

function removerDivida(id){
  state.dividas=(state.dividas||[]).filter(function(d){return d.id!==id;});
  saveState(state);
  renderAll();
  toast("Item removido.");
}

function calcMetrics(){
  var entradas=0,gastos=0,xpTotal=0,xpLuana=0,xpRenato=0,nuTotal=0,acertoRenato=0,essUsado=0,lazUsado=0,impostosDiario=0;
  var porCartao={};
  (state.cartoes||DEFAULT_CARDS).forEach(function(c){porCartao[c.nome]=0;});

  (state.lancamentos||[]).forEach(function(l){
    var val=Number(l.valor||0);
    var pct=Number(l.pctLuana||0);
    var pLuana=val*pct;
    var pRenato=val*(1-pct);
    var env=ENV_BY_CAT[l.cat]||"📌 Fixo/outro";
    if(l.tipo==="Entrada"){
      entradas+=val;
      acertoRenato-=pLuana;
    }else{
      gastos+=val;
      acertoRenato+=pLuana;
      if(l.cat==="Impostos (IPVA / IPTU)")impostosDiario+=val;
      if(env==="🏠 Essenciais")essUsado+=val;
      if(env==="🎉 Lazer")lazUsado+=val;
      if(l.cartao){
        porCartao[l.cartao]=(porCartao[l.cartao]||0)+val;
        if(l.cartao==="XP conjunto"){
          xpTotal+=val;
          xpLuana+=pLuana;
          xpRenato+=pRenato;
        }else if(l.cartao==="Nubank"){
          nuTotal+=val;
        }
      }
    }
  });

  var totalDividasSaldo=0,totalParcelasMes=0,consignadoSaldo=0,consignadoParcela=0,impostosAberto=0,faturasAberto=0;
  (state.dividas||[]).forEach(function(d){
    if(d.pago)return;
    var s=Number(d.saldo||0);
    var p=Number(d.parcela||0);
    totalDividasSaldo+=s;
    totalParcelasMes+=p;
    if(d.tipo==="Empréstimo consignado"){
      consignadoSaldo+=s;
      consignadoParcela+=p;
    }else if(d.tipo==="Imposto (IPVA / IPTU)"){
      impostosAberto+=s;
    }else if(d.tipo==="Fatura / Saldo cartão"){
      faturasAberto+=s;
      if(d.cartao){
        porCartao[d.cartao]=(porCartao[d.cartao]||0)+s;
      }
      if(d.cartao==="XP conjunto"){
        xpTotal+=s;
        xpLuana+=s*0.4;
        xpRenato+=s*0.6;
        acertoRenato+=s*0.4;
      }else if(d.cartao==="Nubank"){
        nuTotal+=s;
      }
    }
  });

  return {
    entradas:entradas,
    gastos:gastos,
    xpTotal:xpTotal,
    xpLuana:xpLuana,
    xpRenato:xpRenato,
    nuTotal:nuTotal,
    porCartao:porCartao,
    acertoRenato:acertoRenato,
    essUsado:essUsado,
    lazUsado:lazUsado,
    impostosDiario:impostosDiario,
    totalDividasSaldo:totalDividasSaldo,
    totalParcelasMes:totalParcelasMes,
    consignadoSaldo:consignadoSaldo,
    consignadoParcela:consignadoParcela,
    impostosAberto:impostosAberto,
    faturasAberto:faturasAberto
  };
}

function toIsoDateFromBr(dataBr){
  var m=String(dataBr||"").trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if(m)return m[3]+"-"+m[2]+"-"+m[1];
  return new Date().toISOString().slice(0,10);
}

  $("lDesc").value=p.desc;
  $("lForma").value=p.forma;

(function(){
  var btnVoice=$("btnVoice");
  var quickIn=$("quickIn");
  if(!btnVoice||!quickIn)return;

  var SpeechRec=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRec){
    btnVoice.onclick=function(){
      toast("Reconhecimento de voz não suportado neste navegador.",true);
    };
    return;
  }

  var rec=new SpeechRec();
  rec.lang="pt-BR";
  rec.interimResults=false;
  rec.maxAlternatives=1;
  var ouvindo=false;

  rec.onstart=function(){
    ouvindo=true;
    btnVoice.textContent="⏹";
    btnVoice.classList.add("btn-voice-on");
    toast("Ouvindo... fale o lançamento.");
  };

  rec.onresult=function(ev){
    var fala=(ev.results&&ev.results[0]&&ev.results[0][0]&&ev.results[0][0].transcript)||"";
    if(!fala)return;
    quickIn.value=fala;
    var parsed=parseQuick(fala);
    if(parsed.valor>0){
      saveLancamento(parsed);
      quickIn.value="";
    }else{
      openModal(fala);
    }
  };

  rec.onerror=function(ev){
    var cod=(ev&&ev.error)||"";
    if(cod==="not-allowed"||cod==="service-not-allowed"){
      toast("Permissão de microfone bloqueada no navegador/celular.",true);
    }else if(cod==="no-speech"){
      toast("Nenhuma fala detectada.",true);
    }else{
      toast("Erro ao capturar voz ("+(cod||"tente novamente")+").",true);
    }
  };

  rec.onend=function(){
    ouvindo=false;
    btnVoice.textContent="🎤";
    btnVoice.classList.remove("btn-voice-on");
  };

  btnVoice.onclick=function(){
    try{
      if(ouvindo){
        rec.stop();
      }else{
        rec.start();
      }
    }catch(e){
      ouvindo=false;
      btnVoice.textContent="🎤";
      btnVoice.classList.remove("btn-voice-on");
    }
  };
})();

};
